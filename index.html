<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo do Leonardo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --sky-top:#ff9a76;
  --sky-mid:#ff6f9c;
  --sky-bottom:#6a5acd;
  --ground:#2b1f3d;
  --ground-line:#4a3768;
  --accent:#ffd166;
  --accent-2:#ff4d8d;
  --card:#2b1f3d;
  --text:#fff8f0;
  --text-dim:#e8dcff;
  --font-display:'Baloo 2', sans-serif;
  --font-body:'Nunito', sans-serif;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  overflow:hidden;
  font-family:var(--font-body);
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

#game{
  width:100%;
  height:100vh;
  position:relative;
  background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
}

.sun{
  position:absolute;
  top:8%;
  right:12%;
  width:90px;
  height:90px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff6d6, var(--accent));
  box-shadow:0 0 60px 10px rgba(255,209,102,0.55);
}

.cloud{
  position:absolute;
  background:rgba(255,255,255,0.75);
  border-radius:50px;
  filter:blur(0.5px);
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.c1{ width:110px; height:34px; top:14%; left:10%; animation:drift 12s linear infinite; }
.c1::before{ width:60px; height:60px; top:-28px; left:12px; }
.c1::after{ width:44px; height:44px; top:-18px; left:56px; }

.c2{ width:80px; height:26px; top:26%; left:60%; animation:drift 16s linear infinite; }
.c2::before{ width:44px; height:44px; top:-20px; left:8px; }
.c2::after{ width:32px; height:32px; top:-12px; left:42px; }

.c3{ width:60px; height:20px; top:38%; left:35%; animation:drift 9s linear infinite; }
.c3::before{ width:32px; height:32px; top:-14px; left:6px; }

@keyframes drift{
  from{ transform:translateX(0); }
  to{ transform:translateX(-120vw); }
}

.rua{
  position:absolute;
  bottom:0;
  width:100%;
  height:120px;
  background:var(--ground);
  border-top:4px solid var(--ground-line);
  overflow:hidden;
}

.faixa{
  position:absolute;
  top:50%;
  width:200%;
  height:8px;
  transform:translateY(-50%);
  background-image:repeating-linear-gradient(90deg, var(--ground-line) 0 40px, transparent 40px 80px);
}

#leonardo, .megan{
  position:absolute;
  bottom:120px;
}

#leonardo{
  left:80px;
  width:95px;
  z-index:5;
}

.megan{
  width:56px;
  z-index:4;
}

#leonardo img, .megan img{
  width:100%;
  display:block;
  filter:drop-shadow(0 8px 6px rgba(0,0,0,0.35));
  border-radius:8px;
}

.squash{
  animation:squash 160ms ease;
}

@keyframes squash{
  0%{ transform:scaleX(1) scaleY(1); }
  40%{ transform:scaleX(1.18) scaleY(0.82); }
  100%{ transform:scaleX(1) scaleY(1); }
}

.coracao-item{
  position:absolute;
  bottom:210px;
  font-size:26px;
  z-index:6;
  animation:balanco 900ms ease-in-out infinite;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,0.3));
}

@keyframes balanco{
  0%,100%{ transform:translateY(0) rotate(-6deg); }
  50%{ transform:translateY(-10px) rotate(6deg); }
}

/* HUD */

#hud{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  z-index:20;
  font-family:var(--font-display);
}

#fase-pill{
  background:rgba(43,31,61,0.85);
  backdrop-filter:blur(6px);
  color:var(--text);
  padding:10px 18px;
  border-radius:999px;
  font-size:18px;
  font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
  display:flex;
  align-items:center;
  gap:10px;
}

#progress-track{
  width:120px;
  height:8px;
  background:rgba(255,255,255,0.25);
  border-radius:999px;
  overflow:hidden;
}

#progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  transition:width 300ms ease;
}

#recorde-pill{
  background:rgba(43,31,61,0.85);
  backdrop-filter:blur(6px);
  color:var(--text-dim);
  padding:10px 16px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  font-family:var(--font-body);
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
}

/* hint */

#hint{
  position:absolute;
  bottom:140px;
  left:50%;
  transform:translateX(-50%);
  color:var(--text);
  font-family:var(--font-body);
  font-weight:700;
  font-size:15px;
  background:rgba(43,31,61,0.55);
  padding:6px 14px;
  border-radius:999px;
  z-index:15;
  animation:pulse 1.6s ease-in-out infinite;
  pointer-events:none;
  white-space:nowrap;
}

@keyframes pulse{
  0%,100%{ opacity:0.55; }
  50%{ opacity:1; }
}

/* overlays */

#overlay{
  position:absolute;
  inset:0;
  background:rgba(20,12,32,0.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  text-align:center;
  padding:20px;
}

#overlay.show{
  display:flex;
}

#overlay-card{
  background:var(--card);
  border:2px solid rgba(255,255,255,0.12);
  border-radius:22px;
  padding:34px 30px;
  max-width:420px;
  color:var(--text);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  animation:pop 260ms cubic-bezier(.2,1.4,.4,1);
}

@keyframes pop{
  0%{ transform:scale(0.7); opacity:0; }
  100%{ transform:scale(1); opacity:1; }
}

#overlay-title{
  font-family:var(--font-display);
  font-size:28px;
  font-weight:800;
  margin-bottom:10px;
}

#overlay-msg{
  font-size:16px;
  color:var(--text-dim);
  line-height:1.5;
  margin-bottom:22px;
}

#overlay-btn{
  font-family:var(--font-display);
  font-weight:700;
  font-size:16px;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  color:#2b1f3d;
  border:none;
  padding:12px 28px;
  border-radius:999px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(255,77,141,0.4);
  transition:transform 120ms ease;
}

#overlay-btn:active{
  transform:scale(0.94);
}

.shake{
  animation:shake 350ms ease;
}

@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-10px); }
  40%{ transform:translateX(8px); }
  60%{ transform:translateX(-6px); }
  80%{ transform:translateX(4px); }
}

.heart-fx{
  position:absolute;
  bottom:130px;
  font-size:22px;
  z-index:30;
  pointer-events:none;
  animation:float-up 900ms ease-out forwards;
}

@keyframes float-up{
  0%{ transform:translateY(0) scale(0.6); opacity:1; }
  100%{ transform:translateY(-90px) scale(1.1); opacity:0; }
}

.popup-score{
  position:absolute;
  font-family:var(--font-display);
  font-weight:800;
  font-size:20px;
  color:var(--accent);
  z-index:31;
  pointer-events:none;
  animation:float-up 700ms ease-out forwards;
  text-shadow:0 2px 4px rgba(0,0,0,0.5);
}

</style>
</head>

const game = document.getElementById("game")
const leonardo = document.getElementById("leonardo")
const faseText = document.getElementById("fase-text")
const progressFill = document.getElementById("progress-fill")
const recordeNum = document.getElementById("recorde-num")
const hint = document.getElementById("hint")
const overlay = document.getElementById("overlay")
const overlayTitle = document.getElementById("overlay-title")
const overlayMsg = document.getElementById("overlay-msg")
const overlayBtn = document.getElementById("overlay-btn")

const VICTORY_SCORE = 15
const GRAVITY = 2400        // px/s^2
const JUMP_SPEED = 820      // px/s upward
const BASE_SPEED = 260      // px/s
const SPEED_STEP = 12       // px/s por ponto
const MAX_SPEED = 640
const COIN_CHANCE = 0.35    // chance de um coração aparecer antes do proximo obstaculo

let score = 0
let recorde = 0
let velocidade = BASE_SPEED

let leoY = 0
let velY = 0
let pulando = false
let ativo = true

let lastTime = null

// --- obstaculo (megan) ---
let meganEl = null
let posicaoMegan = 0
let obstaculoResolvido = false

// --- coracao colecionavel ---
let coracaoEl = null
let posicaoCoracao = 0
let coracaoAtivo = false
let coracaoColetado = false

function frasesDerrota(){
  const opcoes = [
    "Que isso princesa, melhore kkkkkkkkkk",
    "Foi mal, a Megan é rápida demais pra você hoje 😅",
    "Respira, tenta de novo, você consegue!",
    "Quase! Vai que na próxima você passa por cima dela 😏",
    "A velocidade tava alta joguinha, tenta focar mais 👀"
  ]
  return opcoes[Math.floor(Math.random()*opcoes.length)]
}

function criarMegan(){
  const el = document.createElement("div")
  el.className = "megan"
  el.innerHTML = '<img src="' + MEGAN_SRC + '" alt="Megan">'
  game.appendChild(el)
  return el
}

function spawnObstaculo(){
  if(meganEl) meganEl.remove()
  meganEl = criarMegan()
  posicaoMegan = window.innerWidth + 60 + Math.random()*160
  meganEl.style.left = posicaoMegan + "px"
  obstaculoResolvido = false

  if(Math.random() < COIN_CHANCE){
    spawnCoracao()
  }
}

function spawnCoracao(){
  if(coracaoEl) coracaoEl.remove()
  coracaoEl = document.createElement("div")
  coracaoEl.className = "coracao-item"
  coracaoEl.textContent = "❤️"
  posicaoCoracao = posicaoMegan + 90 + Math.random()*60
  coracaoEl.style.left = posicaoCoracao + "px"
  game.appendChild(coracaoEl)
  coracaoAtivo = true
  coracaoColetado = false
}

function popupPontos(x, y, texto){
  const p = document.createElement("div")
  p.className = "popup-score"
  p.textContent = texto
  p.style.left = x + "px"
  p.style.bottom = y + "px"
  game.appendChild(p)
  setTimeout(()=> p.remove(), 700)
}

function mostrarOverlay(tipo){
  ativo = false
  hint.style.display = "none"

  if(tipo === "derrota"){
    overlayTitle.textContent = "Ihh, tropeçou 😵"
    overlayMsg.textContent = frasesDerrota() + " Pontos: " + score + "."
    overlayBtn.textContent = "Tentar de novo"
    overlayBtn.onclick = reiniciar
    game.classList.add("shake")
    setTimeout(()=> game.classList.remove("shake"), 350)
  }else{
    overlayTitle.textContent = "Parabéns! ❤️"
    overlayMsg.textContent = "Você desviou da Megan " + score + " vezes correndo cada vez mais rápido. Vida, te amo, você é foda."
    overlayBtn.textContent = "Continuar"
    overlayBtn.onclick = () => { window.location.href = "quiz_com_musica.html" }
    lancarCoracoes()
  }

  overlay.classList.add("show")
}

function esconderOverlay(){
  overlay.classList.remove("show")
  hint.style.display = "block"
}

function lancarCoracoes(){
  for(let i=0;i<14;i++){
    setTimeout(()=>{
      const h = document.createElement("div")
      h.className = "heart-fx"
      h.textContent = "❤️"
      h.style.left = (10 + Math.random()*80) + "%"
      h.style.fontSize = (16 + Math.random()*18) + "px"
      game.appendChild(h)
      setTimeout(()=> h.remove(), 950)
    }, i*90)
  }
}

function atualizarHud(){
  faseText.textContent = "Pontos: " + score
  progressFill.style.width = Math.min(100, (score/VICTORY_SCORE)*100) + "%"
  if(score > recorde) recorde = score
  recordeNum.textContent = recorde
}

function limparObstaculos(){
  if(meganEl){ meganEl.remove(); meganEl = null }
  if(coracaoEl){ coracaoEl.remove(); coracaoEl = null }
  coracaoAtivo = false
}

function reiniciar(){
  score = 0
  velocidade = BASE_SPEED
  leoY = 0
  velY = 0
  pulando = false
  limparObstaculos()
  atualizarHud()
  esconderOverlay()
  ativo = true
  spawnObstaculo()
}

function ganharPonto(){
  score++
  velocidade = Math.min(MAX_SPEED, BASE_SPEED + score*SPEED_STEP)
  atualizarHud()

  leonardo.classList.add("squash")
  setTimeout(()=> leonardo.classList.remove("squash"), 160)

  if(score >= VICTORY_SCORE){
    limparObstaculos()
    mostrarOverlay("vitoria")
    return
  }

  spawnObstaculo()
}

function pular(e){
  if(e){
    if(e.type === "keydown" && e.code !== "Space" && e.code !== "ArrowUp") return
    e.preventDefault()
  }

  if(!ativo) return
  if(pulando) return

  pulando = true
  velY = JUMP_SPEED
}

document.addEventListener("keydown", pular)
document.addEventListener("touchstart", pular, { passive:false })
document.addEventListener("mousedown", pular)

document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    lastTime = null
  }
})

function gameLoop(timestamp){
  if(lastTime === null) lastTime = timestamp
  let dt = (timestamp - lastTime) / 1000
  dt = Math.min(dt, 0.033)
  lastTime = timestamp

  if(ativo){

    // fisica do pulo
    if(pulando){
      leoY += velY * dt
      velY -= GRAVITY * dt
      if(leoY <= 0){
        leoY = 0
        velY = 0
        pulando = false
      }
      leonardo.style.bottom = (120 + leoY) + "px"
    }

    // movimento do obstaculo
    if(meganEl){
      posicaoMegan -= velocidade * dt
      meganEl.style.left = posicaoMegan + "px"

      const meganRect = meganEl.getBoundingClientRect()
      const leoRect = leonardo.getBoundingClientRect()

      const padX = meganRect.width * 0.22
      const padTop = meganRect.height * 0.15

      const overlapX = leoRect.right - padX > meganRect.left + padX &&
                        leoRect.left + padX < meganRect.right - padX
      const overlapY = leoRect.bottom > meganRect.top + padTop

      if(overlapX && overlapY && !obstaculoResolvido){
        obstaculoResolvido = true

        if(leoRect.bottom <= meganRect.top + padTop + 6){
          popupPontos(leoRect.left, 260, "+1")
          ganharPonto()
        }else{
          mostrarOverlay("derrota")
        }
      }else if(posicaoMegan < -140){
        ganharPonto()
      }
    }

    // movimento do coracao colecionavel
    if(coracaoAtivo && coracaoEl){
      posicaoCoracao -= velocidade * dt
      coracaoEl.style.left = posicaoCoracao + "px"

      const cRect = coracaoEl.getBoundingClientRect()
      const leoRect2 = leonardo.getBoundingClientRect()

      const bateu = leoRect2.right > cRect.left && leoRect2.left < cRect.right &&
                    leoRect2.bottom > cRect.top && leoRect2.top < cRect.bottom

      if(bateu && !coracaoColetado){
        coracaoColetado = true
        popupPontos(cRect.left, 300, "+3 ❤️")
        score += 3
        atualizarHud()
        coracaoEl.remove()
        coracaoEl = null
        coracaoAtivo = false
      }else if(posicaoCoracao < -60){
        coracaoEl.remove()
        coracaoEl = null
        coracaoAtivo = false
      }
    }
  }

  requestAnimationFrame(gameLoop)
}

atualizarHud()
spawnObstaculo()
requestAnimationFrame(gameLoop)

</script>
